name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # Signiert wird nur bei Releases (Tags) und nur, wenn SignPath eingerichtet ist (siehe SIGNING.md).
      # Jede Signieranfrage muss in SignPath manuell freigegeben werden.
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: YARA-X und Regeln (feste Versionen, Pruefsummen)
        shell: pwsh
        run: ./tools/update-yara.ps1

      - name: Test
        run: dotnet test tests/ScanMe.Tests -c Release

      - name: Publish (x64 + ARM64, self-contained single file)
        shell: pwsh
        run: |
          foreach ($rid in "win-x64", "win-arm64") {
            foreach ($proj in "src/ScanMe.App/ScanMe.App.csproj", "src/ScanMe.Cli/ScanMe.Cli.csproj") {
              dotnet publish $proj -c Release -r $rid -o "publish/$rid" --self-contained true `
                -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
                -p:EnableCompressionInSingleFile=true -p:DebugType=none
            }
          }

      # Fehlalarme verhindern: Meldet Defender die fertigen Dateien, wird nichts signiert oder veroeffentlicht.
      - name: Defender-Pruefung
        shell: pwsh
        run: ./tools/defender-scan.ps1 -Path publish/win-x64, publish/win-arm64 -UpdateSignatures

      # --- Signierung (SignPath Foundation) ---
      - name: Upload unsigned EXEs
        id: upload-unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: publish/

      - name: Sign with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: scanme
          signing-policy-slug: release-signing
          artifact-configuration-slug: default
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/

      - name: Verify signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Remove-Item publish -Recurse -Force
          Move-Item signed publish
          $bad = Get-ChildItem publish -Recurse -Filter *.exe | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { throw "Nicht gültig signiert: $($bad.Name -join ', ')" }
          Get-ChildItem publish -Recurse -Filter *.exe | ForEach-Object { "$($_.Directory.Name)/$($_.Name): $((Get-AuthenticodeSignature $_.FullName).SignerCertificate.Subject)" }

      - name: Package
        shell: pwsh
        run: |
          foreach ($rid in "win-x64", "win-arm64") {
            # EXEs plus Data\loldrivers.json (Treiberliste, bewusst nicht in der EXE – siehe ScanMe.Core.csproj)
            Compress-Archive -Path "publish/$rid/*" -DestinationPath "ScanMe-$rid.zip"
          }
          Get-FileHash ScanMe-*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ScanMe
          path: |
            ScanMe-*.zip
            SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ScanMe-*.zip
            SHA256SUMS.txt
          body: |
            [Code signing policy](https://github.com/${{ github.repository }}#code-signing-policy) · Prüfsummen: `SHA256SUMS.txt`
          generate_release_notes: true
